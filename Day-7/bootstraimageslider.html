<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Slider</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      background: #1f2235;
    }

    .carousel-item img{
      height: 500px;
      object-fit: cover;
      border-radius: 20px;
    }

    .carousel-caption{
      background: rgba(0,0,0,0.5);
      border-radius: 20px;
      padding: 20px;
      bottom: 40px;
    }
  </style>
</head>

<body>

  <div class="container py-5">

    <div id="slider" class="carousel slide" data-bs-ride="carousel">

      <!-- Indicators -->
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#slider" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#slider" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#slider" data-bs-slide-to="2"></button>
      </div>

      <!-- Images -->
      <div class="carousel-inner rounded-4 shadow-lg">

        <div class="carousel-item active">
          <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200"
               class="d-block w-100"
               alt="Forest">

          <div class="carousel-caption">
            <h1>Forest</h1>
            <p>Green Forest Scenery</p>
          </div>
        </div>

        <div class="carousel-item">
          <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1200"
               class="d-block w-100"
               alt="Mountain">

          <div class="carousel-caption">
            <h1>Mountain</h1>
            <p>Beautiful Mountain View</p>
          </div>
        </div>

        <div class="carousel-item">
          <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?q=80&w=1200"
               class="d-block w-100"
               alt="Lake">

          <div class="carousel-caption">
            <h1>Lake</h1>
            <p>Peaceful Lake Nature</p>
          </div>
        </div>

      </div>

      <!-- Previous Button -->
      <button class="carousel-control-prev" type="button" data-bs-target="#slider" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>

      <!-- Next Button -->
      <button class="carousel-control-next" type="button" data-bs-target="#slider" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>

    </div>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
