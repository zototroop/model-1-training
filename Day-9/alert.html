<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JavaScript Alert Box</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(to right, #00c6ff, #00f2fe);
    }

    .card{
      background:#fff;
      padding:40px 50px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 8px 20px rgba(0,0,0,0.2);
    }

    h2{
      margin-bottom:20px;
      color:#333;
    }

    button{
      padding:12px 25px;
      border:none;
      border-radius:10px;
      background:#3b5bff;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#274bdb;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>JavaScript Alert Box</h2>
    <button onclick="showAlert()">Click Me</button>
  </div>

  <script>
    function showAlert() {
      alert("Hello! This is JavaScript Alert Box");
    }
  </script>

</body>
</html
